# Newsboy on Urithiru (Synology NAS)
#
# Deploy once as a Portainer stack (Stacks → Add stack → paste this file).
# Put the API keys in the stack's environment variables, not in this file.
#
# After that, deployment is hands-off: every push to main builds a new image
# on GitHub Actions, and Watchtower pulls it within ~5 minutes.

services:
  newsboy:
    image: ghcr.io/toasty-sunbeam/newsboy:latest
    container_name: newsboy
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /volume1/docker/newsboy/data:/data
    environment:
      - DATABASE_URL=file:/data/newsboy.db
      - ORIGIN=${ORIGIN:-http://192.168.0.5:3000}
      - TZ=America/New_York
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - UNSPLASH_ACCESS_KEY=${UNSPLASH_ACCESS_KEY:-}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN:-}
      - CRAYON_GENERATION_ENABLED=${CRAYON_GENERATION_ENABLED:-false}
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Only updates containers labelled above, so it won't touch FreshRSS,
  # Navidrome, Portainer, etc.
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - TZ=America/New_York
