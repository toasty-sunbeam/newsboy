name: Build and publish image

# Pull requests: build only (proves the image still builds).
# Pushes to main: build and publish to ghcr.io/toasty-sunbeam/newsboy:latest.
# Watchtower on the NAS polls for the new :latest and redeploys on its own.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/toasty-sunbeam/newsboy:latest
            ghcr.io/toasty-sunbeam/newsboy:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
