name: Build and publish image

# Any other branch or PR: build only (proves the image still builds).
# Pushes to main: build and publish to ghcr.io/toasty-sunbeam/newsboy:latest.
# Watchtower on the NAS polls for the new :latest and redeploys on its own.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64  # arm64 via QEMU breaks prisma generate; add a native arm runner if ever needed
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/toasty-sunbeam/newsboy:latest
            ghcr.io/toasty-sunbeam/newsboy:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
